repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: end-of-file-fixer
        exclude: ^docs/|^CLAUDE\.md$
      - id: trailing-whitespace
        exclude: ^CLAUDE\.md$

  - repo: https://github.com/pycqa/isort
    rev: 6.0.1
    hooks:
      - id: isort

  - repo: https://github.com/codespell-project/codespell
    rev: v2.4.1
    hooks:
      - id: codespell
        args: [--config, ".codespellrc"]

  - repo: local
    hooks:
      # Share uv.lock with make lint/format-check; do not provision a second Ruff.
      - id: ruff-check
        name: ruff check (locked project environment)
        entry: .venv/bin/python -m ruff check --force-exclude
        language: system
        types_or: [python, pyi]
        require_serial: true
      - id: ruff-format
        name: ruff format (locked project environment)
        entry: .venv/bin/python -m ruff format --force-exclude
        language: system
        types_or: [python, pyi]
        require_serial: true

      # Use the same uv.lock environment and full-package check as make typecheck.
      - id: mypy
        name: mypy (locked project environment)
        entry: .venv/bin/python -m mypy --package xagent
        language: system
        types_or: [python, pyi]
        pass_filenames: false
        exclude: ^src/xagent/migrations/

      - id: alembic-check
        name: alembic-check
        entry: scripts/check_alembic_heads.sh
        language: script
        pass_filenames: false
        files: ^src/xagent/migrations/versions/

      - id: npm-lint
        name: npm lint
        entry: npm run --prefix frontend lint
        language: system
        pass_filenames: false
        types_or: [javascript, jsx, ts, tsx, json]

      - id: npm-type-check
        name: npm type-check
        entry: npm run --prefix frontend type-check
        language: system
        pass_filenames: false
        types_or: [javascript, jsx, ts, tsx]
        exclude: ^frontend/\.next/

      - id: engineering-guardrails
        name: engineering guardrails and frozen baseline
        entry: make guardrails
        language: system
        pass_filenames: false
        always_run: true

      - id: engineering-docs
        name: engineering command and documentation consistency
        entry: make docs-check
        language: system
        pass_filenames: false
        always_run: true

      - id: engineering-secrets
        name: credential scanning
        entry: make secrets-check
        language: system
        pass_filenames: false
        always_run: true
